name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (example: v0.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.inputs.tag, 'v')
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: '*.dmg'
          - os: windows-latest
            artifact: '*.exe'
          - os: ubuntu-latest
            artifact: '*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+.*$ ]]; then
            echo "Tag must look like v1.2.3 (or include suffixes like -beta.1)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:app
      - name: Package and publish
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
