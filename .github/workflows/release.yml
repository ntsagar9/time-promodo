name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            upload_glob: dist/*.dmg
          - os: windows-latest
            upload_glob: dist/*.exe
          - os: ubuntu-latest
            upload_glob: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate release ref
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Release tag: $TAG"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "Tag must look like v1.2.3 (or include suffixes like -beta.1). Current ref: $TAG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:app
      - name: Package app
        run: pnpm exec electron-builder --publish never
      - name: Upload platform assets to release tag
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.upload_glob }}
          fail_on_unmatched_files: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show dist files (debug)
        if: always()
        shell: bash
        run: |
          ls -la dist || true
          echo "Expected upload glob: ${{ matrix.upload_glob }}"
