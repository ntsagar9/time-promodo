name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_args: --win nsis portable
            upload_glob: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap
          - os: ubuntu-latest
            package_args: --linux AppImage
            upload_glob: |
              dist/*.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate release ref
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Release tag: $TAG"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "Tag must look like v1.2.3 (or include suffixes like -beta.1). Current ref: $TAG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:app
      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            rpm \
            xz-utils \
            icnsutils \
            graphicsmagick
      - name: Package app
        run: pnpm exec electron-builder ${{ matrix.package_args }} --publish never
      - name: Upload platform assets to release tag
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.upload_glob }}
          fail_on_unmatched_files: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
